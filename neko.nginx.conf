# ───────────────────────────────────────────────────────────────────────────
# Neko — config nginx (2 sous-domaines + accès IP transitoire)
#   • neko.mxrine-mz.dev      → site Next.js (PM2 « neko-web », 127.0.0.1:3002)
#   • neko-db.mxrine-mz.dev   → panneau admin Next.js (PM2 « neko-db », 127.0.0.1:3000)
#                               Auth applicative : login Discord owner-only (NextAuth)
# Le portfolio (mxrine-mz.dev) a son server_name explicite → totalement isolé.
# certbot --nginx ajoutera les blocs « listen 443 ssl » + redirections.
# ───────────────────────────────────────────────────────────────────────────

# Bloc transitoire : accès direct par l'IP brute (http://91.134.133.186/).
# À retirer une fois les sous-domaines en HTTPS validés.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    listen [::]:8080;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── Site Neko : neko.mxrine-mz.dev ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name neko.mxrine-mz.dev;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── Web-viewer DB : neko-db.mxrine-mz.dev (PRIVÉ, auth Basic) ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name neko-db.mxrine-mz.dev;

    # Auth applicative : login Discord réservé à l'owner (NextAuth dans
    # apps/admin-web). Plus de Basic Auth nginx.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
