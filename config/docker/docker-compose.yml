services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: neko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Bind sur 127.0.0.1 uniquement : accessible depuis l'hôte (web-viewer natif, tunnel SSH), pas public
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neko-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bot Discord Neko
  bot:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile
    container_name: neko-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    volumes:
      - ../../src:/app/src
      - ../../config:/app/config
      - ../../main.js:/app/main.js
      - ../../logs:/app/logs
    networks:
      - neko-network
    command: sh -c "npx prisma migrate deploy --schema=./config/prisma/schema.prisma && npm start"

volumes:
  postgres_data:
    driver: local

networks:
  neko-network:
    driver: bridge
